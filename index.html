<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Sinhala training</title>
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="inline" href="./style.css" />
    <link data-trunk rel="rust" data-cargo-no-default-features data-wasm-opt="s" href="./" />

    <!-- Icons -->
    <link data-trunk rel="copy-file" type="image/png" href="./icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link data-trunk rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
    <link data-trunk rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">
    <link data-trunk rel="copy-file" type="image/png" href="./icons/favicon.ico">
    <link data-trunk rel="copy-file" type="image/png" href="./icons/android-chrome-192x192.png">
    <link data-trunk rel="copy-file" type="image/png" href="./icons/android-chrome-512x512.png">
    <link data-trunk rel="copy-file" type="image/png" href="./icons/site.webmanifest">
    <link rel="manifest" type="image/png" href="/site.webmanifest">
</head>

<body>
    <div id="game" class="center">
        <div id="loading-screen" class="center">
            <span class="spinner"></span>
        </div>

        <canvas id="bevy">
            Javascript and canvas support is required
        </canvas>
    </div>

    <script type="module">
        const loading_screen = document.getElementById('loading-screen');
        const bevy = document.getElementById('bevy');
        const observer = new MutationObserver(() => {
            if (bevy.height > 1) {
                loading_screen.style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(bevy, { attributeFilter: ['height'] });
    </script>
</body>

</html>
