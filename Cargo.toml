[package]
name = "sinhala_training"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.0", default-features = false, features = [
  "bevy_ui",
  "x11",
  "webgl2",
  "bevy_asset",
  "bevy_window",
  "multi_threaded",
]}
#bevy-inspector-egui = "0.31.0"
bevy_asset_loader = { version = "0.23.0" }
#bevy_simple_subsecond_system = "0.1.11"
rand = "0.8.5"
webbrowser = "1.0.5"

[features]
default = [
    # Default to a native dev build.
    "dev_native",
]
dev_native = [
    "dev",
    # Enable asset hot reloading for native dev builds.
    "bevy/file_watcher",
    # Enable embedded asset hot reloading for native dev builds.
    "bevy/embedded_watcher",
]
dev = [
    # Improve compile times for dev builds by linking Bevy as a dynamic library.
    # "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = 'z'
lto = true
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

